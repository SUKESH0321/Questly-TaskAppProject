# Render Blueprint: ONE service hosts the website and the API.
# Create via Dashboard > New > Blueprint and pick this repo.
# Values marked sync:false are typed into the Render dashboard, never committed.
services:
  - type: web
    name: questly
    runtime: node
    plan: free # see DEPLOY.md: free instances sleep, which pauses the task-timer job
    # Builds the website (repo root -> dist/) and the API (backend/ -> backend/dist/).
    # --include=dev because the build tools (TypeScript, Vite) are dev dependencies.
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run build && npm --prefix backend install --include=dev --no-audit --no-fund && npm --prefix backend run build
    startCommand: node backend/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random value
      # Phone OTP, DEMO MODE: no SMS is sent; the code is shown on screen, so a phone number
      # is NOT really verified. To send real texts later, set SMS_PROVIDER=twilio (or msg91),
      # add the TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM values in the dashboard,
      # and remove ALLOW_DEMO_SMS. See DEPLOY.md.
      - key: SMS_PROVIDER
        value: console
      - key: ALLOW_DEMO_SMS
        value: "true"
      # Aadhaar is a DEMO (simulated) check: it verifies nothing. Badges say "Demo ID check".
      - key: KYC_PROVIDER
        value: sandbox
      - key: ALLOW_DEMO_KYC
        value: "true"
      # No CORS_ORIGIN needed: the site and API share one address.
